spring:
  application:
    name: moqi-backend
  ai:
    model:
      chat: none
  profiles:
    active: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MOQI_DB_URL:jdbc:mysql://127.0.0.1:3306/moqi_dev?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${MOQI_DB_USERNAME:root}
    password: ${MOQI_DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

server:
  port: ${MOQI_SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    root: INFO
    com.dugnan.moqi: INFO

moqi:
  security:
    credentials:
      active-key-id: ${MOQI_CREDENTIAL_ACTIVE_KEY_ID:}
      keys: ${MOQI_CREDENTIAL_KEYS:}
  chapter:
    consensus-maturity:
      minimum-new-messages: 2
      minimum-confidence: 0.75
      timeout-seconds: 120
      cooldown-minutes: 5
      max-input-characters: 12000
